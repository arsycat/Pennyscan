name: PennyScan daily

on:
  schedule:
    # Weekdays at 21:45 UTC = 4:45 pm Eastern in winter / 5:45 pm in summer — always after the close
    - cron: "45 21 * * 1-5"
  workflow_dispatch:        # lets you tap "Run workflow" from your phone any time
    inputs:
      preset:
        description: "Scan preset"
        type: choice
        default: quick
        options: [quick, deep, sub1, tight, under1, long]
      market:
        description: "Market"
        type: choice
        default: both
        options: [US, CA, both]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Manual run: just the preset you picked. Scheduled run: swing scan + long-term scan.
      - name: Run scan
        env:
          TZ: America/Edmonton
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python pennyscan.py --preset "${{ inputs.preset }}" --market "${{ inputs.market }}" \
              --no-open --out reports --tag "${{ inputs.preset }}"
          else
            python pennyscan.py --preset quick --market both --no-open --out reports --tag quick
            python pennyscan.py --preset long  --market both --no-open --out reports --tag long
          fi

      # Keep a stable "latest" copy of each preset so you can bookmark it on your phone
      - name: Update latest copies
        run: |
          cd reports
          for tag in quick deep sub1 tight under1 long; do
            f=$(ls -t pennyscan_${tag}_*.pdf 2>/dev/null | head -1)
            [ -n "$f" ] && cp "$f" "latest_${tag}.pdf"
          done
          # prune anything older than 30 days so the repo stays small
          find . -name 'pennyscan_*' -mtime +30 -delete
          true

      - name: Commit reports
        run: |
          git config user.name  "pennyscan-bot"
          git config user.email "pennyscan-bot@users.noreply.github.com"
          git add reports
          git commit -m "scan: $(date +'%Y-%m-%d %H:%M %Z')" || echo "nothing new"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: pennyscan-reports
          path: reports/*.pdf
          if-no-files-found: ignore
